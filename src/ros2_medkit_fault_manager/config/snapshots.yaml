# Snapshot Capture Configuration
#
# This file configures which topics to capture when specific faults are confirmed.
# The captured data provides debugging context at the moment of fault occurrence.
#
# Topic resolution priority:
#   1. fault_specific - exact fault code match (highest priority)
#   2. patterns - regex pattern match on fault code
#   3. default_topics - fallback for all other faults
#   4. entity-default - zero-config fallback when nothing above matches:
#      the reporting source node's own published topics are captured
#      (parameter snapshots.entity_default, on by default)
#
# A fault code listed in fault_specific (or matched by a pattern) with an
# EMPTY topic list is an explicit per-fault opt-out: nothing is captured and
# the entity-default fallback is skipped for that code.
#
# Usage:
#   ros2 run ros2_medkit_fault_manager fault_manager_node \
#     --ros-args -p snapshots.config_file:=/path/to/snapshots.yaml

# Exact fault code to topic mapping (highest priority)
# Use this for specific faults that need particular topics captured
fault_specific:
  MOTOR_OVERHEAT:
    - /joint_states
    - /motor/temperature
    - /motor/current
  BATTERY_LOW:
    - /battery_state
    - /power/consumption
  LIDAR_COMM_FAILURE:
    - /perception/lidar/scan
    - /perception/lidar/diagnostics

# Regex pattern to topic mapping (second priority)
# Patterns are matched against fault codes using std::regex_match
# First matching pattern wins
patterns:
  # All motor-related faults
  "MOTOR_.*":
    - /joint_states
    - /cmd_vel
  # All sensor faults
  "SENSOR_.*":
    - /diagnostics
    - /sensor_data
  # All communication failures
  ".*_COMM_FAILURE":
    - /diagnostics

# Default topics captured for all faults not matching above (lowest priority)
# These are captured as a fallback when no specific or pattern match is found
default_topics:
  - /diagnostics
  - /rosout

# =============================================================================
# Rosbag Capture Configuration
# =============================================================================
#
# Rosbag capture provides "black box" style recording - a ring buffer continuously
# records configured topics, and when a fault is confirmed, the buffer is flushed
# to a bag file along with a short period of post-fault recording.
#
# This is complementary to JSON snapshots:
#   - JSON snapshots: Point-in-time capture, easy to query via REST API
#   - Rosbag capture: Time-window recording, full message fidelity, playback support
#
# Usage:
#   ros2 run ros2_medkit_fault_manager fault_manager_node \
#     --ros-args -p snapshots.rosbag.enabled:=true \
#                -p snapshots.rosbag.duration_sec:=5.0
#
# Or via launch file parameters (see examples below)
#
# NOTE: The rosbag configuration below is for DOCUMENTATION PURPOSES ONLY.
# FaultManagerNode currently reads only `fault_specific`, `patterns`, and
# `default_topics` from this YAML file. Rosbag settings must be configured
# via ROS 2 parameters (--ros-args -p snapshots.rosbag.*) or launch files.

# Keep a fault's value snapshots when it is acknowledged (default: false)
# Off is the historical behaviour: clearing a fault deletes them. Turn it on
# together with rosbag.max_bags_per_fault, or acknowledging leaves the fault
# holding recordings whose matching readings are gone - evidence that no longer
# lines up. Growth stays bounded by max_per_fault either way.
retain_on_clear: false

rosbag:
  # Enable/disable rosbag capture (default: false)
  # When disabled, only JSON snapshots are captured
  enabled: false

  # Ring buffer duration in seconds (default: 5.0)
  # How many seconds of data to keep before fault confirmation
  # Larger values = more context but more memory usage
  duration_sec: 5.0

  # Post-fault recording duration in seconds (default: 1.0)
  # Continue recording after fault is confirmed to capture aftermath
  duration_after_sec: 1.0

  # Topic selection mode (default: "entity")
  # Options:
  #   "entity"   - DEFAULT. Subscribe broadly for pre-roll, but on fault confirmation
  #                write only the faulting source node's topics (+ /tf, /tf_static),
  #                resolved from the fault's reporting source. Useful black box with
  #                zero per-topic config. Falls back to the full buffer if the source
  #                cannot be resolved to a live node.
  #   "config"   - Use same topics as JSON snapshots (from this config file)
  #   "all"      - Record all available topics
  #   "auto"     - Alias for "all" (auto-discover all topics)
  #   "explicit" - Use only topics from include_topics list below
  topics: "entity"

  # Explicit topic list (only used when topics: "explicit")
  # include_topics:
  #   - /joint_states
  #   - /odom
  #   - /cmd_vel

  # Topics to exclude from recording (applies to all modes)
  # Useful to filter out high-bandwidth topics like camera images
  # exclude_topics:
  #   - /camera/image_raw
  #   - /camera/depth/image_raw
  #   - /pointcloud

  # Auto-exclude high-bandwidth sensor topics (image/points/depth/compressed) in
  # broad modes ("all"/"auto"/"entity") to bound memory (default: true).
  # Excluded topics are dropped silently; list them in include_topics to re-add.
  exclude_sensor_topics: true

  # Lazy start mode (default: false)
  # When true, ring buffer only starts when fault enters PREFAILED state
  # Saves resources but may miss early context if fault confirms quickly
  # When false, ring buffer runs continuously from node startup
  lazy_start: false

  # Bag file format (default: "mcap")
  # Options:
  #   "mcap"    - Default; opens directly in Foxglove and Lichtblick
  #   "sqlite3" - Also what an unknown format string lands on
  # Neither backend is privileged over the other: whichever is configured, if
  # its plugin is unavailable at startup the FaultManager logs a warning
  # naming the missing package and falls back to the other one automatically,
  # disabling capture only if neither loads (never crashes). Both
  # rosbag2_storage_mcap and rosbag2_storage_default_plugins (the sqlite3
  # plugin) are runtime dependencies of this package, so a normal install
  # pulls in both backends.
  format: "mcap"

  # Storage path for bag files (default: "" = system temp directory)
  # Empty string uses /tmp/rosbag_snapshots/
  # Bag files are named: fault_{fault_code}_{timestamp}/ and that directory name is
  # the recording's public id - the last segment of its bulk-data URL.
  storage_path: ""

  # Maximum size per bag file in MB (default: 50)
  # If a bag exceeds this size, it will be closed even if still recording
  max_bag_size_mb: 50

  # Maximum total storage for all bag files in MB (default: 500)
  # Oldest bags are deleted when this limit is exceeded. This is the real disk bound;
  # max_bags_per_fault below only decides how the budget is shared out.
  max_total_storage_mb: 500

  # Recordings kept per fault code (default: 1, 0 = unlimited)
  # A fault that keeps re-confirming leaves a trail of black boxes instead of only
  # the latest one. Past the cap the fault's OLDEST recording is dropped, and the bag
  # is deleted once no fault still references it (a burst shares one recording).
  #
  # 1 is the historical behaviour: each re-confirmation replaces the previous bag.
  # 3 is a good starting point for an intermittent fault you are chasing.
  #
  # Think of this as fairness rather than depth: the disk is bounded by
  # max_total_storage_mb either way, and a high value lets one flapping fault consume
  # the budget and evict every other fault's recording.
  max_bags_per_fault: 1

  # Maximum in-memory ring buffer size in MB (default: 256)
  # Oldest buffered messages are dropped once the buffer exceeds this, so a broad
  # subscribe set on a busy robot cannot grow memory without bound.
  max_buffer_mb: 256

  # Match each topic's publisher-offered QoS for faithful capture (default: true)
  # Captures reliable / transient-local topics without dropping; set false to force
  # best-effort SensorDataQoS on every subscription.
  qos_match: true

  # Auto-cleanup bag files when fault is cleared (default: true)
  # When true, bag files are deleted when ClearFault is called
  # When false, bag files persist until manually deleted or storage limit hit
  auto_cleanup: true

# =============================================================================
# Example Configurations
# =============================================================================
#
# Minimal configuration (enable with defaults):
# ---------------------------------------------
# rosbag:
#   enabled: true
#
# Production configuration (conservative resources):
# --------------------------------------------------
# rosbag:
#   enabled: true
#   duration_sec: 3.0
#   duration_after_sec: 0.5
#   topics: "config"
#   lazy_start: true
#   max_bag_size_mb: 25
#   max_total_storage_mb: 200
#   auto_cleanup: true
#
# Development/debugging configuration (more context):
# ---------------------------------------------------
# rosbag:
#   enabled: true
#   duration_sec: 10.0
#   duration_after_sec: 2.0
#   topics: "config"
#   lazy_start: false
#   format: "mcap"
#   storage_path: "/var/log/ros2_medkit/rosbags"
#   max_bag_size_mb: 100
#   max_total_storage_mb: 1000
#   auto_cleanup: false
#
# Explicit topics (specific topics only):
# ---------------------------------------
# rosbag:
#   enabled: true
#   topics: "explicit"
#   include_topics:
#     - /joint_states
#     - /odom
#     - /diagnostics
#   exclude_topics: []
