# SOVD System Manifest: Demo Nodes for Integration Testing
# ========================================================
# This manifest describes the demo nodes used for ros2_medkit gateway
# integration testing. It models an automotive system with subsystems.
#
# Use with: ros2 launch ros2_medkit_integration_tests demo_nodes.launch.py

manifest_version: "1.0"

metadata:
  name: "demo-vehicle"
  version: "1.0.0"
  description: "Demo vehicle system for integration testing"

config:
  # Log a warning per undeclared node during testing to catch manifest
  # mismatches. Use `error` to additionally have them reported on
  # GET /api/v1/health - no policy value stops the gateway.
  unmanifested_nodes: warn
  inherit_runtime_resources: true

# =============================================================================
# AREAS - Vehicle subsystems (matches demo_nodes.launch.py hierarchy)
# =============================================================================
areas:
  - id: powertrain
    name: "Powertrain"
    category: "propulsion"
    namespace: /powertrain
    description: "Engine and transmission systems"
    subareas:
      - id: engine
        name: "Engine"
        namespace: /powertrain/engine
        description: "Engine sensors and calibration services"

  - id: chassis
    name: "Chassis"
    category: "vehicle-dynamics"
    namespace: /chassis
    description: "Braking and suspension systems"
    subareas:
      - id: brakes
        name: "Brakes"
        namespace: /chassis/brakes
        description: "Brake sensors and actuators"

  - id: body
    name: "Body"
    category: "comfort"
    namespace: /body
    description: "Body electronics and comfort systems"
    subareas:
      - id: door
        name: "Door"
        namespace: /body/door
        description: "Door sensors and actuators"
        subareas:
          - id: front-left-door
            name: "Front Left Door"
            namespace: /body/door/front_left

      - id: lights
        name: "Lights"
        namespace: /body/lights
        description: "Interior and exterior lighting"

  - id: perception
    name: "Perception"
    category: "adas"
    namespace: /perception
    description: "ADAS sensors and processing"
    subareas:
      - id: lidar
        name: "LiDAR"
        namespace: /perception/lidar
        description: "LiDAR sensor system"

  # Isolated area used by HATEOAS edge-case manifest entries below; not bound
  # to a running ROS 2 node, exists only to give the unresolved/standalone/
  # area-less tests deterministic targets.
  - id: hateoas-edge-area
    name: "HATEOAS Edge Area"
    namespace: /hateoas_edge
    description: "Reserved for integration test edge cases"

# =============================================================================
# COMPONENTS - Hardware units
# =============================================================================
components:
  # Powertrain components
  - id: engine-ecu
    name: "Engine ECU"
    type: "controller"
    area: engine
    description: "Engine control unit"
    depends_on:
      - temp-sensor-hw
      - rpm-sensor-hw

  - id: temp-sensor-hw
    name: "Temperature Sensor"
    type: "sensor"
    area: engine

  - id: rpm-sensor-hw
    name: "RPM Sensor"
    type: "sensor"
    area: engine

  # Chassis components
  - id: brake-ecu
    name: "Brake ECU"
    type: "controller"
    area: brakes
    depends_on:
      - brake-pressure-sensor-hw
      - brake-actuator-hw

  - id: brake-pressure-sensor-hw
    name: "Brake Pressure Sensor"
    type: "sensor"
    area: brakes

  - id: brake-actuator-hw
    name: "Brake Actuator"
    type: "actuator"
    area: brakes
    depends_on:
      - brake-ecu

  # Body components
  - id: door-sensor-hw
    name: "Door Sensor"
    type: "sensor"
    area: front-left-door

  - id: light-module
    name: "Light Module"
    type: "actuator"
    area: lights

  # Perception components
  - id: lidar-unit
    name: "LiDAR Unit"
    type: "sensor"
    area: lidar

  # HATEOAS edge-case fixtures (manifest-only, no runtime nodes).
  # See test_hateoas.test.py for the corresponding test cases.
  - id: hateoas-component-no-area
    name: "HATEOAS Edge: component without area"
    type: "sensor"
    # area intentionally omitted - exercises the
    # 'parent component resolved but has no area_id' branch.

  # Note: the 'dangling area reference' branch (component points at a
  # non-existent area id) is covered by unit test
  # AppBelongsToReturnsMissingItemWhenAreaUnresolved. We can't seed a
  # component with a missing area_id here because manifest validator R006
  # rejects it and disables manifest-driven discovery for the whole suite.
    description: "360° laser scanner with fault reporting"

# =============================================================================
# APPS - ROS 2 nodes (matches demo_nodes.launch.py exactly)
# =============================================================================
apps:
  # === Powertrain/Engine Apps ===
  - id: engine-temp-sensor
    name: "Engine Temperature Sensor"
    category: "sensor"
    is_located_on: temp-sensor-hw
    description: "Publishes engine temperature readings"
    ros_binding:
      node_name: temp_sensor
      namespace: /powertrain/engine

  - id: engine-temp-monitor
    name: "Engine Temperature Monitor"
    category: "monitoring"
    is_located_on: temp-sensor-hw
    description: "Consumes engine temperature readings and checks them against an overheat threshold"
    ros_binding:
      node_name: temp_monitor
      namespace: /powertrain/engine

  - id: engine-rpm-sensor
    name: "Engine RPM Sensor"
    category: "sensor"
    is_located_on: rpm-sensor-hw
    description: "Publishes engine RPM readings"
    ros_binding:
      node_name: rpm_sensor
      namespace: /powertrain/engine

  - id: engine-calibration-service
    name: "Engine Calibration Service"
    category: "service"
    is_located_on: engine-ecu
    description: "Provides synchronous calibration service (Trigger)"
    ros_binding:
      node_name: calibration
      namespace: /powertrain/engine

  - id: engine-long-calibration
    name: "Engine Long Calibration"
    category: "action"
    is_located_on: engine-ecu
    description: "Provides async long-running calibration action (Fibonacci)"
    depends_on:
      - engine-calibration-service
    ros_binding:
      node_name: long_calibration
      namespace: /powertrain/engine

  # === Chassis/Brakes Apps ===
  - id: brake-pressure-sensor
    name: "Brake Pressure Sensor"
    category: "sensor"
    is_located_on: brake-pressure-sensor-hw
    description: "Publishes brake pressure readings"
    ros_binding:
      node_name: pressure_sensor
      namespace: /chassis/brakes

  - id: brake-actuator
    name: "Brake Actuator"
    category: "actuator"
    is_located_on: brake-actuator-hw
    description: "Controls brake pressure via command topic"
    ros_binding:
      node_name: actuator
      namespace: /chassis/brakes

  # === Body Apps ===
  - id: door-status-sensor
    name: "Door Status Sensor"
    category: "sensor"
    is_located_on: door-sensor-hw
    description: "Publishes door open/closed status"
    ros_binding:
      node_name: status_sensor
      namespace: /body/door/front_left

  - id: light-controller
    name: "Light Controller"
    category: "actuator"
    is_located_on: light-module
    description: "Controls lights via command topic"
    ros_binding:
      node_name: controller
      namespace: /body/lights

  # === Perception Apps ===
  - id: lidar-sensor
    name: "LiDAR Sensor"
    category: "sensor"
    is_located_on: lidar-unit
    description: "LiDAR with fault reporting and calibration service"
    tags:
      - fault-reporter
      - safety-critical
    ros_binding:
      node_name: lidar_sensor
      namespace: /perception/lidar

  # === HATEOAS edge-case apps (manifest-only, no ros_binding) ===
  # Each targets a specific branch of handle_app_belongs_to /
  # handle_app_is_located_on so the integration suite exercises the same
  # shapes the unit tests cover.
  - id: hateoas-app-standalone
    name: "HATEOAS Edge: standalone app"
    category: "fixture"
    description: "App without a parent component (is_located_on omitted)"

  # Note: the 'unresolved parent component' branch is covered by unit test
  # AppBelongsToReturnsMissingItemWhenParentComponentUnresolved instead - the
  # manifest validator (R007) rejects apps that reference a non-existent
  # component even with manifest_strict_validation=false, so we can't seed it
  # here as an integration fixture without disabling discovery for the rest
  # of the suite.

  - id: hateoas-app-on-area-less-component
    name: "HATEOAS Edge: app on component without area"
    category: "fixture"
    description: "Parent component resolves but has no area_id assigned"
    is_located_on: hateoas-component-no-area

# =============================================================================
# FUNCTIONS - High-level capabilities
# =============================================================================
functions:
  - id: engine-monitoring
    name: "Engine Monitoring"
    category: "monitoring"
    description: "Monitor engine health via temperature and RPM"
    hosted_by:
      - engine-temp-sensor
      - engine-temp-monitor
      - engine-rpm-sensor

  - id: engine-calibration
    name: "Engine Calibration"
    category: "maintenance"
    description: "Engine calibration capabilities (sync and async)"
    hosted_by:
      - engine-calibration-service
      - engine-long-calibration

  - id: brake-system
    name: "Brake System"
    category: "safety"
    description: "Complete brake monitoring and control"
    tags:
      - safety-critical
    hosted_by:
      - brake-pressure-sensor
      - brake-actuator

  - id: body-electronics
    name: "Body Electronics"
    category: "comfort"
    description: "Door and lighting control"
    hosted_by:
      - door-status-sensor
      - light-controller

  - id: perception-system
    name: "Perception System"
    category: "adas"
    description: "Environment perception via LiDAR"
    hosted_by:
      - lidar-sensor

# ============================================================================
# Scripts - Pre-deployed diagnostic scripts
# ============================================================================
scripts:
  - id: "run-diagnostics"
    name: "Run Diagnostics"
    description: "Check health of all sensors"
    path: "/opt/ros2_medkit/scripts/run-diagnostics.sh"
    format: "bash"
    timeout_sec: 30
    entity_filter:
      - "components/*"
    env:
      GATEWAY_URL: "http://localhost:8080"

  - id: "inject-nan"
    name: "Inject NaN Fault"
    description: "Enable NaN values on all sensors for testing"
    path: "/opt/ros2_medkit/scripts/inject-nan.sh"
    format: "bash"
    timeout_sec: 30
    entity_filter:
      - "components/compute-unit"
