# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # ── C / C++ ────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        name: clang-format
        types_or: [c, c++]
        exclude: (/vendored/|/third_party/)
        # Uses the project's .clang-format automatically

  # ── CMake ──────────────────────────────────────────────────────────────
  - repo: https://github.com/cmake-lint/cmake-lint
    rev: 1.4.3
    hooks:
      - id: cmakelint
        name: cmake-lint
        args: [--filter=-linelength]

  # ── Shell ──────────────────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: shellcheck

  # ── Python (matches ament_lint_common: flake8 + pep257) ─────────────
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        name: flake8
        additional_dependencies:
          # The five ament_flake8 declares as exec_depend on Jazzy, so code
          # that fails quality.yml also fails here - though only for the
          # files a commit touches; quality.yml lints the whole package.
          # quotes, builtins and comprehensions were missing, which is how Q,
          # A and C4 came to run in CI and nowhere locally.
          - flake8-builtins
          - flake8-comprehensions
          - flake8-docstrings
          - flake8-import-order
          - flake8-quotes
          # Local-only. ament_flake8 comments both out of its package.xml, so
          # CI does not run them; keeping them here makes this hook a superset
          # of CI rather than a match, which is the safe direction.
          - flake8-blind-except
          - flake8-class-newline
        # Config read from .flake8, which is also what ament_flake8 reads (see
        # the CONFIG_FILE argument in ros2_medkit_integration_tests).

  # ── General ────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: pixi\.lock

  # ── Copyright / License (matches ament_cmake_copyright) ────────────
  - repo: local
    hooks:
      - id: ament-copyright
        name: ament-copyright
        entry: ament_copyright
        language: system
        types_or: [c, c++, python, cmake]
        exclude: (/vendored/|/third_party/)

  # ── Issue #375 race regression gate ────────────────────────────────
  - repo: local
    hooks:
      - id: no-naked-ros2-subscriptions
        name: No naked rclcpp subscription / callback-group creation
        entry: ./scripts/check_no_naked_subscriptions.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: gateway-plugin-header-purity
        name: plugin-facing headers must not depend on httplib
        entry: ./src/ros2_medkit_gateway/scripts/check_headers_httplib_free.sh
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: gateway-handlers-typed-query
        name: handlers must read query params via typed query<T>()
        entry: ./src/ros2_medkit_gateway/scripts/check_handlers_typed_query.sh
        language: script
        pass_filenames: false
        always_run: true

  # ── Incremental clang-tidy (pre-push only) ────────────────────────
  # Requires: pre-commit install --hook-type pre-push
  - repo: local
    hooks:
      - id: clang-tidy-diff
        name: clang-tidy (changed files only)
        entry: ./scripts/clang-tidy-diff.sh
        language: system
        types: [c++]
        exclude: (/vendored/|/third_party/)
        stages: [pre-push]
