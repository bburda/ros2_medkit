name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            os_image: ubuntu:jammy
          - ros_distro: lyrical
            os_image: ubuntu:resolute
    container:
      image: ${{ matrix.os_image }}
      # A container gets 64 MB of /dev/shm by default, which is Docker's number and
      # not a considered one. Fast DDS puts a 512 KB segment plus port files there
      # per participant - measured at ~0.65 MB - and a participant killed rather
      # than shut down never gets its segments back. Measured: 15 live
      # participants take 9.6 MB, and 125 killed ones fill 63 MB. 1g is tmpfs, so
      # it costs only what is used, against 16 GB of runner memory.
      options: --shm-size=1g
    # Must stay above the build plus the test step's own budget below, or the job cap kills the
    # run before that step's cap can - which loses the "which step ran long" answer. The build
    # side of this job is around 18 minutes.
    timeout-minutes: 90
    env:
      # One source for the test step's cap. The step's timeout-minutes and the
      # guard that reports the margin both read this.
      TEST_STEP_CAP_MINUTES: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-install ROS 2 apt source
        uses: ./.github/actions/ros-apt-source

      - name: Set up ROS 2 ${{ matrix.ros_distro }}
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - name: Install ccache
        run: apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ccache-${{ matrix.ros_distro }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.ros_distro }}-

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y ros-${{ matrix.ros_distro }}-test-msgs
          if [ "${{ matrix.ros_distro }}" = "humble" ]; then
            apt-get install -y ros-humble-rmw-cyclonedds-cpp
          fi
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          rosdep update
          # Linters (clang-tidy / clang-format) only run in the Jazzy quality
          # job (quality.yml). Multiple package.xml files still list them as
          # <test_depend>, so we skip the rosdep keys here to keep build-and-
          # test runners from pulling in linter packages they never use. Also
          # defensive against transient binary-deb gaps on newly-released
          # distros.
          rosdep install --from-paths src --ignore-src -y \
            --skip-keys "ament_cmake_clang_tidy ament_cmake_clang_format"

      - name: Build packages
        env:
          CCACHE_DIR: /root/.cache/ccache
          CCACHE_MAXSIZE: 500M
          CCACHE_SLOPPINESS: pch_defines,time_macros
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          ccache -z
          colcon build --symlink-install \
            --packages-skip ros2_medkit_opcua \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
            --event-handlers console_direct+
          ccache -s
          ./scripts/ccache_report.sh "${{ matrix.ros_distro }}"

      - name: Record the test step start
        run: echo "TEST_STEP_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run unit and integration tests
        # The suite keeps outgrowing this budget as packages land, and every overrun so far has
        # been real work finishing rather than a hang: 15 minutes was raised to 25 when lyrical
        # reached 14m13s, and 25 was reached again once the graph watchdog's end-to-end scenarios
        # arrived (lyrical 22m50s before them, jazzy 28m15s after). The jazzy job below caps the
        # whole job instead of this step, so only these two distros can be killed mid-package -
        # which reads as a test failure and hides every test the kill cut off.
        # The cap lives in the job's env, referenced here and by the guard below,
        # so raising one raises the other and they cannot drift apart.
        timeout-minutes: ${{ env.TEST_STEP_CAP_MINUTES }}
        env:
          # FastRTPS 2.6 on Humble has a known use-after-free in the
          # discovery-teardown path (EDP::unpairWriterProxy) that segfaults
          # peer nodes when the gateway shuts down, so we force CycloneDDS
          # there. Lyrical ships a newer FastRTPS without that bug and hits
          # a separate iceoryx-shared-memory crash under CycloneDDS during
          # shutdown ("string capacity was zero for allocated data"), so on
          # Lyrical we keep the default FastRTPS. (Jazzy still uses
          # CycloneDDS - see jazzy-test job below for its rationale.)
          RMW_IMPLEMENTATION: ${{ matrix.ros_distro == 'humble' && 'rmw_cyclonedds_cpp' || '' }}
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          # ros2_medkit_graph_watchdog is tested in graph-watchdog below. Its end-to-end suite
          # is 24 minutes on its own, and this step is capped rather than the job, so a package
          # that overruns takes every package behind it down and reports no test name doing it.
          colcon test --return-code-on-test-failure \
            --packages-skip ros2_medkit_opcua ros2_medkit_graph_watchdog \
            --ctest-args -LE linter \
            --event-handlers console_direct+

      - name: Check the run completed, and record the environment
        if: always()
        run: |
          # A step killed by its cap is reported as a failure, not a cancellation,
          # and colcon then names whichever test was in flight. Without this, the
          # overrun reads as one flaky test out of thousands, and the packages
          # queued behind it leave no trace at all.
          # The start is missing only when an earlier step failed before it ran.
          # Say so and carry on to the census, rather than dying on a usage error
          # and taking the environment evidence down with it.
          if [ -n "${TEST_STEP_START:-}" ]; then
            ./scripts/ci_test_completeness.sh "${TEST_STEP_START}" "${TEST_STEP_CAP_MINUTES}" || guard_rc=$?
          else
            echo "::notice::no test step start was recorded - the run failed before the tests"
          fi
          # A DDS participant killed rather than shut down leaves its segments
          # behind for the rest of the job, and the installed middleware decides
          # which transport those segments belong to. Neither is recoverable from
          # a finished run, so both are recorded rather than assumed.
          df -h /dev/shm
          echo "shm segments: $(ls /dev/shm | wc -l)"
          ls -la /dev/shm | head -20
          dpkg -l | grep -E 'rmw-fastrtps|fastdds|cyclonedds' || true
          exit "${guard_rc:-0}"

      - name: Show test results
        if: always()
        run: colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.ros_distro }}
          path: |
            log/
            build/*/test_results/

  # ros2_medkit_graph_watchdog on every distro, in a job of its own.
  # Same reasoning as sanitizer-graph-watchdog in quality.yml: the package's end-to-end suite runs
  # 24 minutes, the sweep it left had 3 minutes of headroom on humble and none at all on lyrical,
  # and a suite that grows with every new detector should not decide whether the packages behind it
  # get to run. Not path-filtered: the plugin drives the gateway, the fault manager and discovery,
  # so the changes most likely to break it are outside its own tree.
  graph-watchdog:
    name: graph_watchdog (${{ matrix.ros_distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            os_image: ubuntu:jammy
            # build-and-test compiles the same sources with the same flags on this
            # distro, so its cache is the superset this job restores from.
            ccache_prefix: ccache-humble-
          - ros_distro: lyrical
            os_image: ubuntu:resolute
            ccache_prefix: ccache-lyrical-
          - ros_distro: jazzy
            os_image: ubuntu:noble
            # ccache-jazzy-test-, not ccache-jazzy-. The shorter prefix also matches
            # ccache-jazzy-asan-, -tsan-, -lint- and -tidy-, and restore-keys takes the
            # most recently created match, so it would restore whichever other Jazzy job
            # finished last. jazzy-test carries the measurement behind that.
            ccache_prefix: ccache-jazzy-test-
    container:
      image: ${{ matrix.os_image }}
      # A container gets 64 MB of /dev/shm by default, which is Docker's number and
      # not a considered one. Fast DDS puts a 512 KB segment plus port files there
      # per participant - measured at ~0.65 MB - and a participant killed rather
      # than shut down never gets its segments back. Measured: 15 live
      # participants take 9.6 MB, and 125 killed ones fill 63 MB. 1g is tmpfs, so
      # it costs only what is used, against 16 GB of runner memory.
      options: --shm-size=1g
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-install ROS 2 apt source
        uses: ./.github/actions/ros-apt-source

      - name: Set up ROS 2 ${{ matrix.ros_distro }}
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - name: Install ccache
        run: apt-get install -y ccache

      - name: Restore ccache
        # Restore, never save. This job compiles a subset of the sources the distro's own
        # sweep compiles, with the same flags, so that job's cache is a superset of what this
        # one needs and serves its misses. A second copy would spend the repository's Actions
        # cache quota twice over for one set of objects. The producer is build-and-test on
        # humble and lyrical, and jazzy-test on jazzy, which is what ccache_prefix names.
        uses: actions/cache/restore@v4
        with:
          path: /root/.cache/ccache
          key: ${{ matrix.ccache_prefix }}${{ github.sha }}
          restore-keys: |
            ${{ matrix.ccache_prefix }}

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y ros-${{ matrix.ros_distro }}-test-msgs
          if [ "${{ matrix.ros_distro }}" = "humble" ] || [ "${{ matrix.ros_distro }}" = "jazzy" ]; then
            apt-get install -y ros-${{ matrix.ros_distro }}-rmw-cyclonedds-cpp
          fi
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          rosdep update
          # Same skip-keys as build-and-test: the linters run only in the Jazzy quality job.
          rosdep install --from-paths src --ignore-src -y \
            --skip-keys "ament_cmake_clang_tidy ament_cmake_clang_format"

      - name: Build packages
        env:
          CCACHE_DIR: /root/.cache/ccache
          CCACHE_MAXSIZE: 500M
          CCACHE_SLOPPINESS: pch_defines,time_macros
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          ccache -z
          # --packages-up-to, not the workspace: the chain reaches the gateway, the fault manager
          # and ros2_medkit_integration_tests, which is a test dependency and is where the launch
          # helpers and the demo nodes the end-to-end scenarios start actually live. opcua is not in
          # that chain, so it needs no explicit skip here.
          colcon build --symlink-install \
            --packages-up-to ros2_medkit_graph_watchdog \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
            --event-handlers console_direct+
          ccache -s
          ./scripts/ccache_report.sh "${{ matrix.ros_distro }}-graph-watchdog"

      - name: Run graph_watchdog tests
        timeout-minutes: 45
        env:
          # The DDS choice belongs to the distro, not to this package - see the long note in
          # build-and-test for why humble is forced onto CycloneDDS and lyrical is not, and
          # the note in jazzy-test for the FastRTPS discovery-teardown use-after-free that
          # puts jazzy on the same implementation.
          RMW_IMPLEMENTATION: ${{ (matrix.ros_distro == 'humble' || matrix.ros_distro == 'jazzy') && 'rmw_cyclonedds_cpp' || '' }}
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon test --return-code-on-test-failure \
            --packages-select ros2_medkit_graph_watchdog \
            --ctest-args -LE linter \
            --event-handlers console_direct+

      - name: Show test results
        if: always()
        run: colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-graph-watchdog-${{ matrix.ros_distro }}
          path: |
            log/
            build/*/test_results/

  # Builds AND tests Jazzy. These were two jobs (jazzy-build -> jazzy-test)
  # passing a tarred build/ + install/ tree between them. That split dates from
  # when lint ran off the same artifact in parallel; lint has since moved to
  # quality.yml, where format-lint and clang-tidy each do their own build, so
  # the artifact was left with exactly one consumer and the split bought no
  # parallelism at all. It cost 4.24 min of duplicated container bring-up and
  # ROS setup in the second job plus 0.50 min of tar/upload in the first.
  #
  # The job id stays jazzy-test because notify-demos gates on it by name.
  jazzy-test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
      # A container gets 64 MB of /dev/shm by default, which is Docker's number and
      # not a considered one. Fast DDS puts a 512 KB segment plus port files there
      # per participant - measured at ~0.65 MB - and a participant killed rather
      # than shut down never gets its segments back. Measured: 15 live
      # participants take 9.6 MB, and 125 killed ones fill 63 MB. 1g is tmpfs, so
      # it costs only what is used, against 16 GB of runner memory.
      options: --shm-size=1g
    # 90, like build-and-test and graph-watchdog. This job covers both the build
    # and the test phase, a cold ccache makes the build phase the variable one,
    # and at 60 it had been finishing in 54 to 56 minutes on main - close enough
    # to the cap that a slow runner timed it out with no failing test to name.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-install ROS 2 apt source
        uses: ./.github/actions/ros-apt-source

      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install ccache
        run: apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          # ccache-jazzy-test-, not ccache-jazzy-. The shorter prefix also
          # matches ccache-jazzy-asan-, -tsan-, -lint- and -tidy-, and
          # restore-keys takes the most recently created match, so this job kept
          # restoring whichever other Jazzy job finished last. It was measured
          # loading the ASan cache: 2 GB of instrumented objects it cannot use,
          # 10% hits, and then 219 cleanups as its own Release objects fought
          # for the 500M ceiling on top of them.
          key: ccache-jazzy-test-${{ github.sha }}
          restore-keys: |
            ccache-jazzy-test-

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            ros-jazzy-test-msgs \
            ros-jazzy-rmw-cyclonedds-cpp
          source /opt/ros/jazzy/setup.bash
          rosdep update
          rosdep install --from-paths src --ignore-src -y

      - name: Build packages
        env:
          CCACHE_DIR: /root/.cache/ccache
          CCACHE_MAXSIZE: 500M
          CCACHE_SLOPPINESS: pch_defines,time_macros
        run: |
          source /opt/ros/jazzy/setup.bash
          ccache -z
          colcon build --symlink-install \
            --packages-skip ros2_medkit_opcua \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
            --event-handlers console_direct+
          ccache -s
          ./scripts/ccache_report.sh jazzy-test

      - name: Run unit and integration tests
        env:
          # FastRTPS has a known use-after-free in discovery-teardown that
          # can segfault peer nodes when another node (typically the gateway)
          # shuts down. CycloneDDS avoids it.
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        run: |
          source /opt/ros/jazzy/setup.bash
          # ros2_medkit_graph_watchdog is tested in graph-watchdog, on this distro too.
          # Its end-to-end suite is 24 minutes, which is most of what stood between this
          # job and its cap.
          colcon test --return-code-on-test-failure \
            --packages-skip ros2_medkit_opcua ros2_medkit_graph_watchdog \
            --ctest-args -LE linter \
            --event-handlers console_direct+

      - name: Show test results
        if: always()
        run: colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jazzy-test
          path: |
            log/
            build/*/test_results/

  coverage:
    # Push to main only. This job owned CI's critical path in 79% of PR runs at
    # ~40 min, and what a PR loses by not running it is narrow: its Codecov
    # upload was already gated to push (see the last step), and the source-tree
    # half of the coverage-scope gate - the half that catches a new package
    # compiling C++ without opting into instrumentation - runs on every PR in
    # quality.yml's format-lint job via check_coverage_packages.sh --static-only.
    # What moves to main-only is the runtime half, which needs .gcda files and
    # therefore needs this job's build and test run.
    #
    # This was also the only PR job building without -DNDEBUG, so on its own it
    # would have taken every assert() out of pull request builds - the other
    # jobs are Release or RelWithDebInfo. ROS2MedkitSanitizers.cmake now passes
    # -UNDEBUG, which puts the asserts back in the two sanitizer jobs. Those run
    # ctest -LE linter per package, a superset of the selection here - they do
    # not skip ros2_medkit_opcua - so the asserts are still exercised against
    # unit and integration tests on every PR.
    #
    # Sharded because this job reached 89m48s against its 90 minute cap - twelve
    # seconds - and its test step grew 166% in a month. It is the only test-bearing
    # job that does not skip ros2_medkit_graph_watchdog, so it alone absorbed the
    # 24 minute suite the others carved out. Measured test time per package on one
    # run: integration_tests 1050s, graph_watchdog ~1440s, gateway + fault_manager
    # 389s, everything else 85s. The shards below follow those numbers.
    #
    # Each shard builds the whole workspace, because every package needs its
    # dependencies built; only the test selection differs. Minutes are free on a
    # public repository and wall clock is not, so paying for the build four times
    # to quarter the wall clock is the right trade here.
    name: coverage (${{ matrix.shard }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      # Mandatory. With fail-fast a single failing shard cancels the others, and a
      # cancelled job is indistinguishable from one killed by its cap.
      fail-fast: false
      matrix:
        include:
          - shard: integration
            select: --packages-select ros2_medkit_integration_tests
          - shard: graph-watchdog
            select: --packages-select ros2_medkit_graph_watchdog
          - shard: gateway
            select: --packages-select ros2_medkit_gateway ros2_medkit_fault_manager
          - shard: rest
            select: >-
              --packages-skip ros2_medkit_opcua ros2_medkit_integration_tests
              ros2_medkit_graph_watchdog ros2_medkit_gateway ros2_medkit_fault_manager
    # Left at 90 deliberately. The measured worst shard should land near 45, but
    # the first run after this change starts from a cold per-shard ccache, so the
    # honest sequence is to keep the cap, read the margin the test step now
    # records, and lower it once there are numbers rather than expectations.
    container:
      image: ubuntu:noble
      # A container gets 64 MB of /dev/shm by default, which is Docker's number and
      # not a considered one. Fast DDS puts a 512 KB segment plus port files there
      # per participant - measured at ~0.65 MB - and a participant killed rather
      # than shut down never gets its segments back. Measured: 15 live
      # participants take 9.6 MB, and 125 killed ones fill 63 MB. 1g is tmpfs, so
      # it costs only what is used, against 16 GB of runner memory.
      options: --shm-size=1g
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-install ROS 2 apt source
        uses: ./.github/actions/ros-apt-source

      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install ccache
        run: apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          # One entry for the whole matrix, not one per shard: every shard builds
          # the same workspace with the same flags, so per-shard entries would
          # quadruple this cache against a 10 GB repository limit and evict the
          # very entries that keep the builds warm. Concurrent shards racing to
          # save the same key is benign - the first wins, the rest log it.
          key: ccache-coverage-${{ github.sha }}
          restore-keys: |
            ccache-coverage-

      - name: Install dependencies
        run: |
          apt-get update
          # gpg is required by codecov/codecov-action@v5 dependency check
          apt-get install -y lcov ros-jazzy-test-msgs gpg
          source /opt/ros/jazzy/setup.bash
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build packages with coverage
        env:
          CCACHE_DIR: /root/.cache/ccache
          CCACHE_MAXSIZE: 500M
          CCACHE_SLOPPINESS: pch_defines,time_macros
        run: |
          source /opt/ros/jazzy/setup.bash
          ccache -z
          colcon build --symlink-install \
            --packages-skip ros2_medkit_opcua \
            --cmake-args -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON \
            --event-handlers console_direct+
          ccache -s
          ./scripts/ccache_report.sh coverage

      - name: Run unit and integration tests for coverage
        run: |
          source /opt/ros/jazzy/setup.bash
          # --return-code-on-test-failure, as in the two other colcon test
          # invocations in this file. Without it colcon exits 0 whatever the
          # tests did, so this job ran the full Jazzy suite under a coverage
          # build and could not fail CI on a failure - it read as a gate
          # without being one.
          colcon test --return-code-on-test-failure \
            ${{ matrix.select }} \
            --ctest-args -LE linter \
            --event-handlers console_direct+

      - name: Generate coverage report
        run: |
          # --parallel: this single lcov --capture was measured at >99% of the
          # whole step (13.43 min of 13.50, 17.87 of 17.95) and is otherwise
          # single-threaded, while --extract, --remove, --list and genhtml
          # together finish in under six seconds. It forks per .gcda directory,
          # so the output is the same records from the same gcov runs, only
          # gathered concurrently.
          lcov --capture --directory build --output-file coverage.raw.info \
            --parallel "$(nproc)" \
            --ignore-errors mismatch,negative,empty,gcov

          if [ ! -s coverage.raw.info ] || ! grep -q 'SF:' coverage.raw.info; then
            echo "::error::No valid coverage data found in coverage.raw.info"
            exit 1
          fi

          # $PWD, not pwd -P: gcov records the path the compiler was given, which
          # is the logical one. Resolving symlinks here would stop matching.
          WS="${PWD}"
          lcov --extract coverage.raw.info \
            "${WS}/src/*/src/*" \
            "${WS}/src/*/include/*" \
            --output-file coverage.extracted.info \
            --ignore-errors unused,empty

          lcov --remove coverage.extracted.info \
            '*/vendored/*' \
            --output-file coverage.info \
            --ignore-errors unused,empty

          if [ ! -s coverage.info ]; then
            echo "::error::Filtered coverage.info is empty - no source files matched"
            exit 1
          fi

          lcov --list coverage.info

      # No completeness gate here: a shard only ever exercises its own packages, so
      # every shard's tracefile is legitimately partial. The gate runs on the
      # merged report in coverage-merge below, which is the first place the
      # question "did every package reach the report" can be asked.
      - name: Upload this shard's tracefile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-tracefile-${{ matrix.shard }}
          path: coverage.info
          retention-days: 1

  # The shards each measure their own packages, so no single one of them can
  # answer "does the report still describe the whole workspace". This job is the
  # first place that question exists, so the completeness gate, the HTML report
  # and the Codecov upload all live here rather than being repeated four times
  # against four partial answers.
  coverage-merge:
    name: coverage (merge)
    # always(), so a failed shard does not take the merged report, the
    # completeness gate and the Codecov upload down with it. Losing the
    # diagnostic exactly when a shard broke is the wrong way round; the job
    # reports what it merged and then fails on the shard's behalf.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Install tools
        run: |
          apt-get update
          # gpg and curl are both required by the codecov action's dependency
          # check, which fails the step rather than skipping the upload.
          apt-get install -y git lcov gpg curl

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download every shard's tracefile
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-tracefile-*
          path: tracefiles
          # A shard that failed uploaded nothing; merge what exists rather than
          # failing here, so the report still describes the shards that ran.
          merge-multiple: false

      - name: Merge the tracefiles
        run: |
          # lcov -a sums execution counts for matching file and test names, which
          # is exactly right here: the shards measure disjoint packages, and any
          # file two of them both touched should carry the sum of both.
          mapfile -t files < <(find tracefiles -name coverage.info | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no shard tracefiles were downloaded - the shards produced nothing to merge"
            exit 1
          fi
          echo "merging ${#files[@]} tracefiles"
          args=()
          for f in "${files[@]}"; do args+=(-a "$f"); done
          lcov "${args[@]}" --output-file coverage.info --ignore-errors empty,corrupt
          lcov --list coverage.info
          genhtml coverage.info --output-directory coverage_html --ignore-errors source

      # A package that never gets --coverage emits no .gcda and drops out of the
      # report entirely - out of the numerator and the denominator both, so the
      # percentage silently stops describing the workspace. Assert the merged
      # report still covers every package the source tree says holds production
      # C++. Sharding makes this stricter, not weaker: a shard that silently
      # tested nothing now shows up as a package missing from the merge.
      - name: Verify every C++ package reached the coverage report
        run: |
          ./scripts/check_coverage_packages.sh coverage.info \
            --skip ros2_medkit_opcua

      - name: Upload coverage HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_html/

      # Last, so everything above is recorded first. The merged report is still
      # worth having when a shard broke - it just does not describe the whole
      # workspace, and saying so is this job's business.
      - name: Fail if any shard did not succeed
        if: needs.coverage.result != 'success'
        run: |
          echo "::error::a coverage shard did not succeed (matrix result: ${{ needs.coverage.result }}). The merged report above covers only the shards that finished, so its percentage is a floor, not the workspace figure."
          exit 1

      - name: Upload coverage to Codecov
        if: needs.coverage.result == 'success'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
          flags: unittests,integration
          name: ros2_medkit-coverage
          fail_ci_if_error: true
          verbose: true

  notify-demos:
    needs: [jazzy-test]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.jazzy-test.result == 'success'
    runs-on: ubuntu-latest
    # Only Jazzy gates the dispatch. Humble failures do not block demos CI - intentional tradeoff.
    permissions: {}
    steps:
      - name: Trigger selfpatch_demos CI
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DEMOS_DISPATCH_TOKEN }}
          repository: selfpatch/selfpatch_demos
          event-type: ros2_medkit_updated
          client-payload: '{"sha":"${{ github.sha }}","run_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
